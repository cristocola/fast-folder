[package]
name = "fastf"
version = "1.1.1"
edition = "2024"
rust-version = "1.88"
description = "Fast Folder Creator — template-driven project folder generator with TUI and browser UI"
license = "MIT"
repository = "https://github.com/cristocola/fast-folder"
homepage = "https://github.com/cristocola/fast-folder"
authors = ["Cristo Cola"]
readme = "README.md"
keywords = ["cli", "template", "scaffolding", "folders", "productivity"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "fastf"
path = "src/main.rs"

# Windowless launcher for the browser UI — what the Windows Start Menu
# shortcut runs. Built everywhere (keeps clippy/tests uniform); only the
# Windows artifacts ship it.
[[bin]]
name = "fastf-ui"
path = "src/bin/fastf-ui.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
chrono = "0.4"
anyhow = "1"
colored = "2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Property tests for the pure logic (naming, globs, the query parser). Exhaustive
# generated input finds the cases handwritten tests miss — the "sanitize_name
# output is always a creatable filename" property is the one that matters most.
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
