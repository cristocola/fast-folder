name: "Music Video"
slug: "music-video"
description: "Music video production project folder"
version: "1"

naming_pattern: "{date}_{artist}_{title}_{client_type}_{id}"

id:
  prefix: "ID"
  digits: 4

variables:
  - slug: artist
    label: "Artist / Band Name"
    type: text
    required: true
    transform: title_underscore

  - slug: title
    label: "Project Title"
    type: text
    required: true
    transform: title_underscore

  - slug: client_type
    label: "Client Type"
    type: select
    options: ["Client", "Personal", "Collab", "Spec"]
    default: "Client"

structure:
  - name: "01_Assets"
    children:
      - name: "01_Audio"
      - name: "02_Footage"
      - name: "03_Images"
  - name: "02_Export"
    children:
      - name: "01_Finals"
      - name: "02_WIP"
  - name: "03_Project_Files"
