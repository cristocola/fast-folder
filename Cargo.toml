[package]
name = "fastf"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Fast Folder Creator — template-driven project folder generator with a guided TUI and CLI"
license = "MIT"
repository = "https://github.com/cristocola/fast-folder"
homepage = "https://github.com/cristocola/fast-folder"
authors = ["Cristo Cola"]
readme = "README.md"
keywords = ["cli", "template", "scaffolding", "folders", "productivity"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "fastf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
# `serde_yaml 0.9` is archived upstream. `serde_yaml_ng` is the maintained
# drop-in fork; `util::yaml` is the only module that names either of them, and
# `the_emitted_bytes_are_the_ones_we_have_always_emitted` pins the output.
serde_yaml_ng = "0.10"
toml = "0.8"
# Only the local/UTC clock and formatting are used. The default features also
# pull `oldtime`, `wasmbind` and `unstable-locales`, none of which fastf calls.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
colored = "3"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Also a dev-dependency so integration tests (separate crates) can drive fastf
# through a real pty — `dialoguer` refuses to prompt without a TTY, so the
# confirmations and pickers are otherwise untestable. Already vendored for unix
# builds, so this adds no new supply-chain surface.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Property tests for the pure logic (naming, globs, the query parser). Exhaustive
# generated input finds the cases handwritten tests miss — the "sanitize_name
# output is always a creatable filename" property is the one that matters most.
proptest = { version = "1", default-features = false, features = ["std"] }

# Do not add `panic = "abort"`. The TUI restores the terminal while unwinding;
# aborting would leave it in raw mode with the cursor hidden.
[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
