name: CI

# `workflow_call` is what lets `release.yml` run this *whole* file as its gate,
# rather than a tag being able to publish something CI has never seen.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  # An advisory is published against a dependency, not against a commit, so a
  # push-only audit never fires for a lockfile nobody has touched. Weekly.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege for every job here: this workflow only ever reads the
# repository. `release.yml` grants `contents: write` to the one job that
# publishes, and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Clippy runs on both platforms because `#[cfg(windows)]` code is invisible to
  # a Linux-only lint job, and `--all-targets` on Windows also covers the
  # Windows-only test cases in `windows_semantics.rs`. Formatting is
  # platform-independent, so it runs once.
  #
  # Everything but `audit` skips on the weekly schedule: re-running the suite
  # against an unchanged tree proves nothing, and the advisory database is the
  # only thing that moved.
  lint:
    name: fmt + clippy (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      # Release too, on one platform. `#[cfg(debug_assertions)]` code — the
      # failpoints and the tracer — does not exist in a release build, so an
      # item used *only* from it becomes dead there and nowhere else. A
      # debug-only lint cannot see that, and the AUR source package's `check()`
      # is a release test build, so its users saw warnings CI called clean.
      - run: cargo clippy --all-targets --release -- -D warnings
        if: runner.os == 'Linux'

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  # Optimizations change timing, and the concurrency suite races real processes.
  # A release run is the one most likely to surface an ordering bug that the
  # debug build's slower code paths happen to hide.
  #
  # Fault injection is compiled out of release builds, so the tests that trip
  # failpoints are `#[cfg(debug_assertions)]` and simply do not exist here. The
  # debug job above is what covers crash recovery.
  test-release:
    name: test --release (windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --release

      # The published exe has to start on a clean Windows install, where no
      # Visual C++ Redistributable exists — `.cargo/config.toml` links the CRT
      # statically for that. Asserted here, on a PR, rather than only in
      # `release.yml`, where the fix would mean re-cutting a tag.
      - name: release binary depends on no redistributable CRT
        shell: pwsh
        run: ./packaging/windows/assert-standalone.ps1 target/release/fastf.exe

  # `rust-version` in Cargo.toml is a promise to users on older toolchains, and
  # nothing verified it — the stated MSRV could break with no signal at all.
  msrv:
    name: minimum supported Rust version
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets

  # Catches advisories against dependencies. This is the job that would have
  # flagged serde_yaml as unmaintained, and the one the weekly schedule exists
  # for: an advisory is published against a crate, not against a commit.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    # The action reports through a check run, and opens an issue when the
    # weekly schedule finds something. Granted here and nowhere else.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The Linux installer is published by merging it: raw.githubusercontent.com
  # serves it from `main`, so nothing but this job stands between an edit and
  # everyone's next install. It runs the working tree's script against the
  # latest release, in homes that have never seen fastf, with no terminal (so
  # it never asks about /usr/local). The installs are real downloads; the
  # question and the sudo path need a terminal, so they are not covered here.
  install-script:
    name: Linux installer
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -s sh packaging/linux/install.sh
      - name: install, reinstall, and use it
        shell: bash
        run: |
          set -euo pipefail
          # A clean environment: a fresh HOME, a PATH without ~/.local/bin.
          install_into() { env -i HOME="$1" PATH=/usr/bin:/bin "${@:2}" sh packaging/linux/install.sh </dev/null; }
          fail() { echo "::error::$*"; exit 1; }

          home=$(mktemp -d)
          first=$(install_into "$home" FASTF_INSTALL=user); echo "$first"
          second=$(install_into "$home" FASTF_INSTALL=user); echo "$second"
          line="export PATH=\"$home/.local/bin:\$PATH\""

          "$home/.local/bin/fastf" --version || fail "the installed binary does not run"
          [ "$(grep -cxF "$line" "$home/.profile")" = 1 ] \
            || fail "~/.profile should hold the PATH line exactly once after two runs"
          found=$(env -i HOME="$home" PATH=/usr/bin:/bin bash -lc 'command -v fastf') \
            && [ "$found" = "$home/.local/bin/fastf" ] || fail "a login shell does not find fastf"
          grep -qxF "Exec=$home/.local/bin/fastf" "$home/.local/share/applications/fastf.desktop" \
            || fail "the desktop entry should name the binary by its full path"
          grep -qF "open a new one and run fastf" <<<"$first" || fail "the first run should say to open a new terminal"
          ! grep -qiE 'put [^ ]+ on your PATH' <<<"$second" \
            || fail "a second run must not tell anyone to fix PATH by hand"

          # With nobody to ask, the default is ~/.local, whatever sudo allows.
          home=$(mktemp -d)
          install_into "$home" >/dev/null
          [ -x "$home/.local/bin/fastf" ] || fail "with no terminal, the install should go to ~/.local"

          # Already on PATH: it works at once and no profile is touched.
          home=$(mktemp -d)
          out=$(env -i HOME="$home" PATH="$home/.local/bin:/usr/bin:/bin" sh packaging/linux/install.sh </dev/null)
          echo "$out"
          grep -qF "Run fastf to start." <<<"$out" || fail "with ~/.local/bin on PATH it should say run fastf"
          [ ! -s "$home/.profile" ] || fail "with ~/.local/bin on PATH no profile should change"

  docs:
    name: docs build clean
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --locked
