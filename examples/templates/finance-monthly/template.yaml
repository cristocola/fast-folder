name: Monthly Finance Report
slug: finance-monthly
description: Date-stamped monthly finance folder with INCOME/, EXPENSES/, RECEIPTS/, and a REPORT.md.
version: "1"
naming_pattern: "{YYYY}-{MM}_{entity}_Finance"
id:
  prefix: FIN
  digits: 4
variables:
  - slug: entity
    label: Entity / account name
    type: text
    required: true
    transform: upper_underscore
  - slug: preparer
    label: Prepared by
    type: text
    required: false
    default: ""
    transform: none
structure:
  - name: INCOME
  - name: EXPENSES
    children:
      - name: FIXED
      - name: VARIABLE
  - name: RECEIPTS
  - name: RECONCILIATION
  - name: STATEMENTS
